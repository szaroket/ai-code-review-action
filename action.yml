name: "AI PR Code Review"
description: "Reviews a PR's diff against caller-supplied rules and review criteria, using Claude."
inputs:
  pr-number:
    description: "Pull request number to review."
    required: true
  repo:
    description: "OWNER/REPO to review. Defaults to GITHUB_REPOSITORY, then the local checkout's origin remote."
    required: false
  rules-file:
    description: "Path to the repository rules file, injected into the prompt verbatim. Optional."
    required: false
    default: "AGENTS.md"
  criteria-file:
    description: "Path to a markdown file with at least one `##` review criterion. Required."
    required: true
  lessons-file:
    description: "Optional path to an additional lessons/pitfalls file."
    required: false
  scope-dirs:
    description: "Restrict the review to files under these directory prefixes (comma-separated). Omit to review every changed file."
    required: false
  exclude:
    description: "Glob pattern(s) of paths to exclude from the review (comma-separated)."
    required: false
  model:
    description: "Model to run the review with."
    required: false
    default: "claude-sonnet-5"
  max-turns:
    description: "Agent turn budget."
    required: false
    default: "5"
  max-findings:
    description: "Maximum number of findings to keep, after deduplication."
    required: false
    default: "30"
  format:
    description: "Which output form(s) to produce: console, json, markdown, or all."
    required: false
    default: "console"
  publish:
    description: "Post the review to GitHub as real inline PR comments."
    required: false
    default: "false"
  trust-head-files:
    description: "Read the rules/lessons/criteria files from the working checkout instead of the PR's base ref. Unsafe for pull requests you don't control."
    required: false
    default: "false"
  out-dir:
    description: "Directory to write review artifacts into."
    required: false
    default: "./review-output"
  anthropic-api-key:
    description: "Direct Anthropic API key. Set this, or the base-url/auth-token pair below for a gateway, not both."
    required: false
    default: ""
  anthropic-base-url:
    description: "Base URL for an Anthropic-API-compatible gateway (e.g. OpenRouter). Used together with anthropic-auth-token."
    required: false
    default: ""
  anthropic-auth-token:
    description: "Auth token for an Anthropic-API-compatible gateway. Used together with anthropic-base-url."
    required: false
    default: ""
  github-token:
    description: "GitHub token with pull-requests: write permission (for --publish) and read access to the repo being reviewed."
    required: true
runs:
  using: "composite"
  steps:
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
    - name: Install pr-review-agent
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: uv sync --project "$ACTION_PATH"
    # Every input reaches the script through `env:`, never through `${{ }}`
    # inside `run:`. Expressions are substituted textually before bash parses
    # the line, so quoting an interpolation gives no protection at all — a
    # consumer passing e.g. `scope-dirs: ${{ github.event.comment.body }}`
    # would otherwise hand a PR commenter a shell on the runner, with GH_TOKEN
    # and the Anthropic token already exported into this very step.
    - name: Run review
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic-base-url }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.anthropic-auth-token }}
        GH_TOKEN: ${{ inputs.github-token }}
        ACTION_PATH: ${{ github.action_path }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_RULES_FILE: ${{ inputs.rules-file }}
        INPUT_CRITERIA_FILE: ${{ inputs.criteria-file }}
        INPUT_LESSONS_FILE: ${{ inputs.lessons-file }}
        INPUT_SCOPE_DIRS: ${{ inputs.scope-dirs }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_MAX_TURNS: ${{ inputs.max-turns }}
        INPUT_MAX_FINDINGS: ${{ inputs.max-findings }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUT_DIR: ${{ inputs.out-dir }}
        INPUT_PUBLISH: ${{ inputs.publish }}
        INPUT_TRUST_HEAD_FILES: ${{ inputs.trust-head-files }}
      run: |
        set -euo pipefail
        args=(
          --pr "$INPUT_PR_NUMBER"
          --rules-file "$INPUT_RULES_FILE"
          --criteria-file "$INPUT_CRITERIA_FILE"
          --max-turns "$INPUT_MAX_TURNS"
          --max-findings "$INPUT_MAX_FINDINGS"
          --out-dir "$INPUT_OUT_DIR"
          --model "$INPUT_MODEL"
          --format "$INPUT_FORMAT"
          --verbose
        )
        # `if` rather than `[ ... ] && args+=(...)`: under `set -e` a failing
        # test would make the whole compound non-zero and abort the step.
        if [ -n "$INPUT_REPO" ]; then args+=(--repo "$INPUT_REPO"); fi
        if [ -n "$INPUT_LESSONS_FILE" ]; then args+=(--lessons-file "$INPUT_LESSONS_FILE"); fi
        if [ -n "$INPUT_SCOPE_DIRS" ]; then args+=(--scope-dirs "$INPUT_SCOPE_DIRS"); fi
        if [ -n "$INPUT_EXCLUDE" ]; then args+=(--exclude "$INPUT_EXCLUDE"); fi
        if [ "$INPUT_PUBLISH" = "true" ]; then args+=(--publish); fi
        if [ "$INPUT_TRUST_HEAD_FILES" = "true" ]; then args+=(--trust-head-files); fi
        uv run --project "$ACTION_PATH" pr-review-agent "${args[@]}"
