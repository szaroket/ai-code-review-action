[project]
name = "pr-review-agent"
version = "0.1.0"
description = "Claude Agent SDK-powered PR diff reviewer, run as a reusable GitHub Action"
readme = "README.md"
authors = [
    { name = "szaroket", email = "30178095+szaroket@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.128",
    "githubkit>=0.16.0",
    # Imported directly by github_publish.py for the reviews-endpoint body
    # type. It currently arrives transitively via githubkit, but a githubkit
    # release that vendors or renames it would break the import at module load
    # — before argparse runs, so with no mapped exit code.
    "githubkit-schemas>=26.7.29",
    "truststore>=0.10.4",
    "unidiff>=1.0.0",
]

[project.scripts]
pr-review-agent = "pr_review_agent.cli:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff.lint]
extend-select = ["D"]
# Only D107 (__init__) and D105 (magic methods) are waived. The rest of the
# D1xx missing-docstring rules stay ON: "every function gets a Google-style
# docstring with Args/Returns/Raises" is a standing project rule, and a
# blanket ignore = ["D1"] would disable exactly the check that enforces it.
ignore = ["D107", "D105"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names are the documentation; a docstring is added only when a test's
# intent isn't obvious from its name.
"tests/*" = ["D100", "D103"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
